<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 – Formulário de Avaliação de Produto - Bernardo Soares da Silva Filho</title>
    <meta name="description" content="Avalie seu produto e compartilhe sua experiência. Informe os detalhes da instalação, dê sua nota e ajude outros clientes a escolher melhor">
    <meta name="author" content="Bernardo Soares da Silva Filho">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

    <!-- FOLHAS DE ESTILO -->
    <link href="estilos/formulario-normalize.css" rel="stylesheet">
    <!-- celular padrão -->
    <link href="estilos/formulario-pequeno.css" rel="stylesheet">
    <!-- melhoria para tablet -->
    <link href="estilos/formulario-medio.css" rel="stylesheet">
    <!-- melhoria para desktop -->
    <link href="estilos/formulario-grande.css" rel="stylesheet">
    <script src="scripts/formulario.js" defer></script>
        
</head>

<body>
	<header>
        <h1>Avaliação do Produto</h1>
    </header>
          
    <main>
        <form method="get" action="avaliacao.html" class="fw1">
            <fieldset>
                <legend>Informações do Produto</legend>
                <label>Nome do Produto*
                    <select id="produto" name="produto" required>
                        <option value="" disabled selected>Selecione um Produto...</option>
                    </select>
                </label>
            </fieldset>
        
            <fieldset>
                <legend>Classificação Geral*</legend>
                <div>Selecione a nota</div>
                <label><input type="radio" id="estrela1" name="classificacao" value="1" required> ☆</label>
                <label><input type="radio" id="estrela2" name="classificacao" value="2"> ☆☆</label>
                <label><input type="radio" id="estrela3" name="classificacao" value="3"> ☆☆☆</label>
                <label><input type="radio" id="estrela4" name="classificacao" value="4"> ☆☆☆☆</label>
                <label><input type="radio" id="estrela5" name="classificacao" value="5"> ☆☆☆☆☆</label> 
            </fieldset>               
            <fieldset>
                <legend>Detalhes da Instalação</legend>
                <label>Data de Instalação <input type="date" id="dataInstalacao" name="dataInstalacao" required></label>
            </fieldset>
            
            <fieldset>
                <legend>Recursos Úteis</legend>
                <div>Quais recursos você achou úteis? <span class="instrucao">(Marque todos que se aplicam)</span></div>
                <label><input type="checkbox" id="recursoDurabilidade" name="durabilidade" value="durabilidade"> Durabilidade</label>
                <label><input type="checkbox" id="recursoFacilidade" name="facilidade" value="facilidade"> Facilidade de Uso</label>
                <label><input type="checkbox" id="recursoDesempenho" name="desempenho" value="desempenho"> Desempenho</label>
                <label><input type="checkbox" id="recursoDesign" name="design" value="design"> Design</label>
            </fieldset>
            
            <fieldset>
                <legend>Avaliação Escrita</legend>
                <label for="avaliacaoEscrita">Sua Avaliação <span class="opcional">(Opcional)</span></label>
                <textarea id="avaliacaoEscrita" name="avaliacaoEscrita" rows="5" placeholder="Escreva aqui sua avaliação..."></textarea>
            </fieldset>
            
            <fieldset>
                <legend>Nome de Usuário</legend>
                <label for="nomeUsuario">Seu Nome <span class="opcional">(Opcional)</span></label>
                <input type="text" id="nomeUsuario" name="nomeUsuario" placeholder="Seu nome">
            </fieldset>
            
            <input type="submit" value="Publicar Avaliação">
        
        </form>
    </main>
     
    <footer>
        <p>&copy;<span id="anoatual"></span> - Bernardo Soares - Brasil</p>
        <p id="ultimaModificacao"></p>
    </footer>

</body>
</html>
